<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXOKIN Web</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>PIXOKIN</h1>
      <button id="logoutBtn" class="ghost hidden">Logout</button>
    </header>

    <main class="container">
      <section id="authSection" class="card">
        <h2>Welcome</h2>
        <p>Sign up or login to manage collaborative albums.</p>
        <div class="tabs">
          <button id="showLogin" class="tab active">Login</button>
          <button id="showSignup" class="tab">Signup</button>
        </div>

        <form id="loginForm" class="form">
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <form id="signupForm" class="form hidden">
          <input name="name" type="text" placeholder="Name" required />
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Create account</button>
        </form>
      </section>

      <section id="appSection" class="hidden">
        <div class="grid">
          <article class="card">
            <h3>Your Albums</h3>
            <div class="row">
              <input id="albumName" type="text" placeholder="New album name" />
              <button id="createAlbumBtn">Create</button>
            </div>
            <div class="row">
              <input id="inviteCode" type="text" placeholder="Invite code" />
              <button id="joinAlbumBtn" class="secondary">Join</button>
            </div>
            <ul id="albumList" class="list"></ul>
          </article>

          <article class="card">
            <h3 id="mediaTitle">Album Media</h3>
            <p id="selectedAlbumHint" class="muted">Select an album to view media.</p>

            <form id="uploadForm" class="form hidden" enctype="multipart/form-data">
              <input id="uploadFile" name="file" type="file" accept="image/*,video/*" required />
              <input id="caption" name="caption" type="text" placeholder="Caption" />
              <button type="submit">Upload</button>
            </form>

            <div id="mediaGrid" class="media-grid"></div>
          </article>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
